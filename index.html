<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>У меня к тебе вопрос</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
    </div>
    <canvas id="petals" aria-hidden="true"></canvas>

    <main class="stage">
      <section class="card" id="invite">
        <p class="kicker">тихо, не кричи</p>
        <h1>Пойдёшь со мной на свидание?</h1>
        <p class="lead">
          Кофе, вечерний свет, разговоры ни о чём и немного волнения.
          Я уже всё придумал — осталось только твоё «да».
        </p>

        <div class="actions">
          <button class="btn yes" id="yesBtn" type="button">Да, пойду</button>
          <button class="btn no" id="noBtn" type="button">Нет</button>
        </div>
        <p class="hint" id="hint">Если сомневаешься — попробуй нажать «Нет».</p>
      </section>

      <section class="card success" id="success" hidden aria-live="polite">
        <p class="kicker">вот и ответ</p>
        <h1>Значит, свидание состоится</h1>
        <p class="lead">
          Выбери место и время — я получу письмо и приду.
        </p>

        <form id="dateForm" class="date-form">
          <label>
            <span>Когда</span>
            <input id="dateInput" type="date" name="date" required />
          </label>
          <label>
            <span>Во сколько</span>
            <input id="timeInput" type="time" name="time" required />
          </label>
          <label>
            <span>Где</span>
            <input
              id="placeInput"
              type="text"
              name="place"
              maxlength="120"
              placeholder="кафе, набережная, кино..."
              required
            />
          </label>
          <label>
            <span>Сообщение</span>
            <textarea
              id="noteInput"
              name="note"
              rows="3"
              maxlength="400"
              placeholder="можно пару слов, можно ничего"
            ></textarea>
          </label>
          <button class="btn yes" id="sendBtn" type="submit">Отправить на почту</button>
          <p class="form-status" id="formStatus" role="status"></p>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
